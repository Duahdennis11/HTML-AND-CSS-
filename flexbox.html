<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practice</title>
</head>

<body style="padding-bottom: 1010px;">
    <div style="
      display: flex;
      flex-direction: row;
    ">
        <div style="background-color: lightblue;">div 1 text</div>
        <div style="background-color: lightpink;">div 2
            <p>text</p>
        </div>
    </div>

    <div style="
      margin-top: 30px;
      display: flex;
      flex-direction: row;
    ">
        <div style="
        background-color: lightblue;
        width: 100px;
      ">100px</div>
        <div style="
        background-color: lightpink;
        flex: 1;
      ">flex: 1</div>
    </div>

    <div style="
      margin-top: 30px;
      display: flex;
      flex-direction: row;
    ">
        <div style="
        background-color: lightblue;
        flex: 1;
      ">flex: 1</div>
        <div style="
        background-color: lightpink;
        width: 100px;
      ">100px</div>
        <div style="
        background-color: lightblue;
        flex: 2;
      ">flex: 2</div>
    </div>

    <div style="
      margin-top: 32px;
      height: 72px;
      border-width: 1px;
      border-style: solid;
      border-color: rgb(169, 168, 168);
      display: flex;
      flex-direction: row;
      justify-content: center;
    ">

        <div style="
        background-color: rgb(182, 224, 238);
        width: 100px;
      ">100px</div>
        <div style="
        background-color: rgb(253, 195, 204);
        width: 100px;
      ">100px</div>
        <div style="
        background-color: rgb(161, 199, 212);
        width: 100px;
      ">100px</div>
    </div>

    <div style="
      margin-top: 32px;
      height: 72px;
      border-width: 1px;
      border-style: solid;
      border-color: rgb(159, 157, 157);
      display: flex;
      flex-direction: row;
      justify-content: space-between;
    ">
        <div style="
        background-color: rgb(172, 223, 240);
        width: 100px;
      ">100px</div>
        <div style="
        background-color: rgb(236, 233, 234);
        width: 100px;
      ">100px</div>
        <div style="
        background-color: rgb(163, 199, 211);
        width: 100px;
      ">100px</div>
    </div>

    <div style="
      margin-top: 32px;
      height: 72px;
      border-width: 1px;
      border-style: solid;
      border-color: rgb(196, 191, 191);
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    ">

        <div style="
        background-color: rgb(172, 223, 240);
        width: 100px;
      ">100px</div>
        <div style="
        background-color: rgb(245, 222, 226);
        width: 100px;
      ">100px</div>
        <div style="
        background-color: rgb(204, 239, 250);
        width: 100px;
      ">100px</div>
    </div>
</body>

</html>
